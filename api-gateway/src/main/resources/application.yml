server:
  port: 8082

spring:
  main:
    web-application-type: reactive   # ← ADD THIS
  application:
    name: api-gateway

  cloud:
    gateway:
      # Automatically create routes from Eureka – every service is reachable
      # at /SERVICE-NAME/** without manual route entries.
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true   # use lowercase: /user-service/** instead of /USER-SERVICE/**

      # ── Manual routes (explicit is better for production) ──────────────────
      routes:
        # ── User-Service ────────────────────────────────────────────────────
        - id: user-service-auth
          uri: lb://user-service        # resolved via Eureka + Ribbon/LB
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1

        - id: user-service-users
          uri: lb://user-service
          predicates:
            - Path=/api/users/**
          filters:
            - StripPrefix=1

        # ── Certification-Service (before /api/admin/** for /api/admin/oral) ─
        - id: certification-service-admin-oral
          uri: lb://certification-service
          predicates:
            - Path=/api/admin/oral/**

        - id: user-service-admin
          uri: lb://user-service
          predicates:
            - Path=/api/admin/**
          filters:
            - StripPrefix=1

        - id: user-service-superadmin
          uri: lb://user-service
          predicates:
            - Path=/api/superadmin/**
          filters:
            - StripPrefix=1

        # ── Business-Service (partners/deals/packs/access-codes) ───────────
        - id: business-service-partners
          uri: lb://business-service
          predicates:
            - Path=/api/partners/**

        - id: business-service-deals
          uri: lb://business-service
          predicates:
            - Path=/api/deals/**

        - id: business-service-packs
          uri: lb://business-service
          predicates:
            - Path=/api/packs/**

        - id: business-service-access-codes
          uri: lb://business-service
          predicates:
            - Path=/api/access-codes/**

        # ── Partner-Performance-Service ─────────────────────────────────────
        - id: partner-performance-service
          uri: lb://partner-performance-service
          predicates:
            - Path=/api/partner-performance/**

        # ── Partner-Contract-Service ────────────────────────────────────────
        - id: partner-contract-service
          uri: lb://partner-contract-service
          predicates:
            - Path=/api/partner-contracts/**

        # ── Voucher-Fraud-Service ────────────────────────────────────────
        - id: voucher-fraud-service
          uri: lb://voucher-fraud-service
          predicates:
            - Path=/api/voucher-fraud/**

        # ── Partner-Billing-Service ────────────────────────────────────────
        - id: partner-billing-service
          uri: lb://partner-billing-service
          predicates:
            - Path=/api/partner-billing/**

        # ── Partner-Intelligence-Service ───────────────────────────────────
        - id: partner-intelligence-service
          uri: lb://partner-intelligence-service
          predicates:
            - Path=/api/partner-intelligence/**

        # ── Shop-Service (gestion shop) – single gateway ──────────────────────
        - id: shop-service-all
          uri: lb://shop-service
          predicates:
            - Path=/api/shop/**
          filters:
            - RewritePath=/api/shop/(?<segment>.*), /gestionshop/${segment}

        - id: shop-service-payments
          uri: lb://shop-service
          predicates:
            - Path=/api/payments/**
          filters:
            - RewritePath=/api/payments/(?<segment>.*), /gestionshop/payment/${segment}

        # ── Formation-Service – single gateway ───────────────────────────────
        - id: formation-service-formations
          uri: lb://formation-service
          predicates:
            - Path=/api/formations/**

        - id: formation-service-examens
          uri: lb://formation-service
          predicates:
            - Path=/api/examens/**

        - id: formation-service-evaluations
          uri: lb://formation-service
          predicates:
            - Path=/api/evaluations/**

        - id: formation-service-result-examens
          uri: lb://formation-service
          predicates:
            - Path=/api/result-examens/**

        - id: formation-service-result-evaluations
          uri: lb://formation-service
          predicates:
            - Path=/api/result-evaluations/**

        - id: formation-service-contenus
          uri: lb://formation-service
          predicates:
            - Path=/api/contenus-formation/**

        - id: formation-service-agent-thinking
          uri: lb://formation-service
          predicates:
            - Path=/api/agent-thinking/**

        - id: document-service-documents
          uri: lb://document-service
          predicates:
            - Path=/api/documents/**

        - id: article-service-articles
          uri: lb://article-service
          predicates:
            - Path=/api/articles/**

        # ── Certification-Service (formecertification) – single gateway ─────────
        - id: certification-service-certifications
          uri: lb://certification-service
          predicates:
            - Path=/api/certifications/**

        - id: certification-service-oral-sessions
          uri: lb://certification-service
          predicates:
            - Path=/api/oral-sessions/**

        - id: certification-service-oral-assignments
          uri: lb://certification-service
          predicates:
            - Path=/api/oral-assignments/**

        - id: certification-service-reschedule
          uri: lb://certification-service
          predicates:
            - Path=/api/reschedule/**

        - id: certification-service-me
          uri: lb://certification-service
          predicates:
            - Path=/api/me/**

        - id: certification-service-admin-reschedule
          uri: lb://certification-service
          predicates:
            - Path=/api/admin/reschedule/**

        - id: certification-service-admin-issued
          uri: lb://certification-service
          predicates:
            - Path=/api/admin/issued-certifications/**

        - id: certification-service-admin-feedback
          uri: lb://certification-service
          predicates:
            - Path=/api/admin/feedback/**

        - id: certification-service-admin-user-directory
          uri: lb://certification-service
          predicates:
            - Path=/api/admin/user-directory/**

        - id: certification-service-issued-pdf
          uri: lb://certification-service
          predicates:
            - Path=/api/issued-certifications/**

        # ── Events-Service ───────────────────────────────────────────────────
        - id: events-service-api
          uri: lb://events-service
          predicates:
            - Path=/api/events/**

      # ── Global CORS ────────────────────────────────────────────────────────
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:4200"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true
            maxAge: 3600
# ── Eureka Client registration ─────────────────────────────────────────────
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, gateway

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
