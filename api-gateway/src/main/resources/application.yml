server:
  port: 8082

spring:
  main:
    web-application-type: reactive   # ← ADD THIS
  application:
    name: api-gateway

  cloud:
    gateway:
      # Automatically create routes from Eureka – every service is reachable
      # at /SERVICE-NAME/** without manual route entries.
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true   # use lowercase: /user-service/** instead of /USER-SERVICE/**

      # ── Manual routes (explicit is better for production) ──────────────────
      routes:
        # ── User-Service ────────────────────────────────────────────────────
        - id: user-service-auth
          uri: lb://user-service        # resolved via Eureka + Ribbon/LB
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1

        - id: user-service-users
          uri: lb://user-service
          predicates:
            - Path=/api/users/**
          filters:
            - StripPrefix=1

        - id: user-service-admin
          uri: lb://user-service
          predicates:
            - Path=/api/admin/**
          filters:
            - StripPrefix=1

        - id: user-service-superadmin
          uri: lb://user-service
          predicates:
            - Path=/api/superadmin/**
          filters:
            - StripPrefix=1
      
      # ── Global CORS ────────────────────────────────────────────────────────
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:4200"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true
            maxAge: 3600
# ── Eureka Client registration ─────────────────────────────────────────────
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, gateway

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
