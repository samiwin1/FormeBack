server.port=8087
spring.application.name=article-service
server.servlet.context-path=/api

spring.datasource.url=jdbc:mysql://localhost:3306/forme?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

translation.libre.base-url=${LIBRE_TRANSLATE_BASE_URL:http://localhost:5000}
translation.libre.api-key=${LIBRE_TRANSLATE_API_KEY:}
comment.moderation.bad-words=${COMMENT_BAD_WORDS:fuck,shit,bitch,asshole,bastard,merde,putain,salope}
