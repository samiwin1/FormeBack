apiVersion: v1
kind: PersistentVolume
metadata:
  name: certification-mysql-pv
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: "/data/certification-mysql"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: certification-mysql-pvc
  namespace: devops
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-certification
  namespace: devops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql-certification
  template:
    metadata:
      labels:
        app: mysql-certification
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: "root"
            - name: MYSQL_DATABASE
              value: "forme_certification1"
          ports:
            - containerPort: 3306
          volumeMounts:
            - name: mysql-storage
              mountPath: /var/lib/mysql
      volumes:
        - name: mysql-storage
          persistentVolumeClaim:
            claimName: certification-mysql-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-certification
  namespace: devops
spec:
  selector:
    app: mysql-certification
  ports:
    - port: 3306
      targetPort: 3306
  type: ClusterIP
