# certification-secret.yaml
#
# HOW TO GENERATE BASE64 VALUES (run in PowerShell):
#   [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("your-value-here"))
#
# Examples of common values already encoded below — REPLACE with your real values:
#   jwt-secret     : replace with your actual JWT_SECRET value (min 32 chars)
#   mail-username  : your Gmail address used for notifications
#   mail-password  : your Gmail App Password (not your Gmail login password)
#   google-ai-key  : your Google AI / Gemini API key

apiVersion: v1
kind: Secret
metadata:
  name: certification-secret
  namespace: devops
type: Opaque
data:
  # "changeme-jwt-secret-key-32chars!!" encoded in base64
  jwt-secret: Y2hhbmdlbWUtand0LXNlY3JldC1rZXktMzJjaGFycyEh

  # "forme@forme.com" encoded in base64
  mail-username: Zm9ybWVAZm9ybWUuY29t

  # Replace with your real Gmail App Password encoded in base64
  mail-password: Y2hhbmdlbWU=

  # Replace with your real Google AI API key encoded in base64
  google-ai-key: Y2hhbmdlbWU=
