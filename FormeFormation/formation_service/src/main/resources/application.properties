spring.application.name=formation-service

spring.datasource.url=jdbc:mysql://localhost:3306/forme_formation?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
server.port=8083

# Eureka Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

springdoc.swagger-ui.path=/swagger-ui

spring.web.cors.allow-credentials=true
spring.web.cors.allowed-origins=http://localhost:4200

management.endpoints.web.exposure.include=health,info

# Disable DevTools restart to avoid Eureka shutdown race (Connection pool shut down during unregister)
spring.devtools.restart.enabled=false
