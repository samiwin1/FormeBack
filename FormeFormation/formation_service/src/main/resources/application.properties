spring.application.name=formation-service

spring.datasource.url=jdbc:mysql://localhost:3306/forme_formation?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
server.port=8083

# Eureka Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

springdoc.swagger-ui.path=/swagger-ui

# CORS disabled: formation-service is only called via api-gateway (8082 or 8084).
# The gateway handles CORS. Enabling here causes duplicate Access-Control-Allow-Origin.
# spring.web.cors.allow-credentials=true
# spring.web.cors.allowed-origins=http://localhost:4200

management.endpoints.web.exposure.include=health,info

# Disable DevTools restart to avoid Eureka shutdown race (Connection pool shut down during unregister)
spring.devtools.restart.enabled=false

# Agent-thinking animation frames (relative to formation_service dir)
agent.thinking.path=../agent-thinking

# Gemini API - Required for "Generate with AI" in formation creation.
# Get or renew your key: https://aistudio.google.com/app/apikey
# If you see "API key expired", create a new key at that link, replace the value below (or set env GEMINI_API_KEY), then restart formation-service.
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=${GEMINI_API_MODEL:gemini-2.0-flash}
