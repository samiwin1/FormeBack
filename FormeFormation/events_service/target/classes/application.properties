spring.application.name=events-service

spring.datasource.url=jdbc:mysql://localhost:3306/forme_events?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
server.port=8092

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

management.endpoints.web.exposure.include=health,info

spring.devtools.restart.enabled=false

spring.servlet.multipart.max-file-size=80MB
spring.servlet.multipart.max-request-size=85MB

# Use Google AI Studio key: https://aistudio.google.com/app/apikey
# Prefer env GEMINI_API_KEY so keys are not committed; optional gemini.api.model override (GEMINI_MODEL).
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=${GEMINI_MODEL:gemini-2.5-flash}
