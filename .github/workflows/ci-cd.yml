name: Mentor Service CI/CD

# Trigger on every push to 'mentor' branch and on pull requests targeting it.
on:
  push:
    branches: [ mentor ]
  pull_request:
    branches: [ mentor ]

env:
  # DockerHub image names — override via repository secrets.
  BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/mentor-service

jobs:

  # ─── 1. Test ──────────────────────────────────────────────────────────────
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      # Run backend tests (currently no tests, but the command succeeds).
      - name: Backend tests
        run: mvn test -B
        working-directory: .

  # ─── 2. Build ─────────────────────────────────────────────────────────────
  build:
    name: Build JAR
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Build JAR (skip tests — already ran in test job)
        run: mvn package -DskipTests -B
        working-directory: .

      # Upload the JAR so later jobs can use it without rebuilding.
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: mentor-service-jar
          path: target/mentor-service-0.0.1-SNAPSHOT.jar
          retention-days: 1

  # ─── 3. SonarQube Code Quality ────────────────────────────────────────────
  sonar:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          # SonarQube needs full git history for blame info.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Run SonarQube scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          mvn verify sonar:sonar -B \
            -Dsonar.projectKey=mentor-service \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }}
        working-directory: .

  # ─── 4 & 5. Build & Push Docker Image ────────────────────────────────────
  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: sonar
    # Only push on direct pushes to 'mentor' (not on PRs).
    if: github.event_name == 'push'
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17 (needed to build inside Docker multi-stage)
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push mentor-service image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          # Tag with both the git SHA (immutable) and 'latest'.
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── 6. Deploy via docker-compose ────────────────────────────────────────
  deploy:
    name: Deploy with docker-compose
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push'
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # Replace the 'build' section in docker-compose with the pre-built image
      # so the server pulls from DockerHub instead of building from source.
      - name: Patch docker-compose to use DockerHub image
        run: |
          sed -i "s|build:|# build:|g" docker-compose.yml
          sed -i "s|context: .|# context: .|g" docker-compose.yml
          sed -i "s|dockerfile: Dockerfile|# dockerfile: Dockerfile|g" docker-compose.yml
          sed -i "/container_name: mentor-service/a\\    image: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}" docker-compose.yml

      # Copy compose file + prometheus config to the deployment server via SSH.
      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "docker-compose.yml,prometheus.yml"
          target: "~/mentor-service"

      # SSH into the server and run docker-compose.
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ~/mentor-service
            # Write env file from GitHub secrets.
            cat > .env << 'EOF'
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            APP_JWT_SECRET=${{ secrets.APP_JWT_SECRET }}
            MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}
            MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
            GOOGLE_AI_API_KEY=${{ secrets.GOOGLE_AI_API_KEY }}
            FORMATION_INTERNAL_TOKEN=${{ secrets.FORMATION_INTERNAL_TOKEN }}
            EOF
            docker compose pull
            docker compose up -d --remove-orphans
            docker compose ps
