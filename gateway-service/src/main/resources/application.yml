server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:4200"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      discovery:
        locator:
          enabled: true
      routes:
        - id: certification-service-certifications
          uri: lb://certification-service
          predicates:
            - Path=/api/certifications/**

        - id: certification-service-oral-sessions
          uri: lb://certification-service
          predicates:
            - Path=/api/oral-sessions/**

        - id: certification-service-oral-assignments
          uri: lb://certification-service
          predicates:
            - Path=/api/oral-assignments/**

        - id: certification-service-me-certifications
          uri: lb://certification-service
          predicates:
            - Path=/api/me/certifications/**

        - id: certification-service-me-all
          uri: lb://certification-service
          predicates:
            - Path=/api/me/**

        - id: certification-service-reschedule
          uri: lb://certification-service
          predicates:
            - Path=/api/reschedule/**

        - id: certification-service-admin-oral
          uri: lb://certification-service
          predicates:
            - Path=/api/admin/oral/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
