apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: pidev
type: Opaque
# Values are base64-encoded. To encode: echo -n 'value' | base64
# DB_PASSWORD default is empty (root with no password for dev)
# Replace with real values before deploying to production.
data:
  # echo -n '' | base64  →  (empty string)
  DB_PASSWORD: ""
  # echo -n 'root' | base64  →  cm9vdA==
  DB_USERNAME: cm9vdA==
  # echo -n 'forme_certification1' | base64
  DB_NAME_CERTIFICATION: Zm9ybWVfY2VydGlmaWNhdGlvbjE=
  # echo -n 'forme_mentor' | base64
  DB_NAME_MENTOR: Zm9ybWVfbWVudG9y
  # echo -n 'ThisIsA32PlusCharSecretKeyChangeMe' | base64
  JWT_SECRET: VGhpc0lzQTMyUGx1c0NoYXJTZWNyZXRLZXlDaGFuZ2VNZQ==
