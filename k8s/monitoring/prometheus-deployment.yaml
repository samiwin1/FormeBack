apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: pidev
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: 'formation'
        static_configs:
        - targets: ['formation:8081']
        metrics_path: '/actuator/prometheus'
      - job_name: 'event'
        static_configs:
        - targets: ['event:8082']
        metrics_path: '/actuator/prometheus'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: pidev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
      - name: prometheus
        image: prom/prometheus:latest
        args:
        - '--config.file=/etc/prometheus/prometheus.yml'
        ports:
        - containerPort: 9090
        volumeMounts:
        - name: config
          mountPath: /etc/prometheus
      volumes:
      - name: config
        configMap:
          name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: pidev
spec:
  selector:
    app: prometheus
  ports:
  - port: 9090
    targetPort: 9090
    nodePort: 30090
  type: NodePort
