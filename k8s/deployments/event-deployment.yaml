apiVersion: apps/v1
kind: Deployment
metadata:
  name: event
  namespace: pidev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: event
  template:
    metadata:
      labels:
        app: event
    spec:
      containers:
      - name: event
        image: selmianas/event:latest
        ports:
        - containerPort: 8082
        env:
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: username
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: password
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8082
          initialDelaySeconds: 60
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: event
  namespace: pidev
spec:
  selector:
    app: event
  ports:
  - port: 8082
    targetPort: 8082
    nodePort: 30082
  type: NodePort
