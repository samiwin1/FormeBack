server:
  port: 8085

spring:
  application:
    name: business-service

  datasource:
    url: jdbc:mysql://localhost:3306/microservices_db?createDatabaseIfNotExist=true
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQL8Dialect

  h2:
    console:
      enabled: false