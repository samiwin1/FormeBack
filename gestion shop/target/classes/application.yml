server:
  port: 8083
  servlet:
    context-path: /gestionshop
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: shop-service

  datasource:
    url: jdbc:mysql://localhost:3306/Gestionshop?createDatabaseIfNotExist=true
    username: root
    password:

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: false
    baseline-on-migrate: true

springdoc:
  swagger-ui:
    path: /swagger-ui

# ── Stripe ──
stripe:
  secret-key: sk_test_51QxSSXChmhEZInbmR6aYUoeUBKCHZmrTbk9VLrJqIJ4Qxdx2CgMceDWuWwSFg8mw0lMlJzihLOvDfzwfJ3T8sh9s00jiKsyxze

# ── Eureka Client ──
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    enable:
      all: true
